spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://172.18.0.100:5432/KeyGo
    username: KeyGo
    # 密码仅由环境变量注入，不再在仓库中保留默认值；旧默认密码已泄露进 Git 历史，应尽快在数据库侧轮换
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  servlet:
    # 限制上传体积，防止超大 Excel 文件打满内存
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Remember-Me 签名密钥：必须由环境变量 KEYGO_REMEMBER_ME_KEY 注入随机长字符串；
# 不提供默认值——缺失时启动直接失败（fail-fast），避免使用仓库中已知的弱密钥签发 Cookie
keygo:
  security:
    remember-me-key: ${KEYGO_REMEMBER_ME_KEY}

logging:
  level:
    root: INFO
    org.springframework: WARN
    # 显式配置了 DaoAuthenticationProvider 后 UserDetailsService 不再参与自动装配，属预期行为
    org.springframework.security.config.annotation.authentication.configuration: ERROR
    org.hibernate: WARN
    xyz.lukix.keygo: INFO
  file:
    name: /var/log/yourapp/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB