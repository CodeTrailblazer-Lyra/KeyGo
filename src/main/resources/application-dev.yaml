# =============================================================================
# KeyGo 开发环境配置（profile: dev）
# =============================================================================

spring:
  config:
    activate:
      on-profile: dev

  # ---------------------------------------------------------------------------
  # 数据源：本地 Docker PostgreSQL
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/keygo
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------------------------
  # Redis：本地 Docker Redis
  # ---------------------------------------------------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 1s
      connect-timeout: 1s

  # ---------------------------------------------------------------------------
  # JPA：开发期自动建表 + SQL 日志输出
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# ---------------------------------------------------------------------------
# 日志：开发期详细输出
# ---------------------------------------------------------------------------
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE     # SQL 参数绑定值（替代已弃用的 BasicBinder）
    org.springframework.web: DEBUG
    xyz.lukix.keygo: DEBUG

# ---------------------------------------------------------------------------
# 开发环境 Remember-Me 密钥（代码中已有默认值，此处显式声明便于定位）
# ---------------------------------------------------------------------------
keygo:
  security:
    remember-me-key: KeyGoRememberMeKeyDev
