spring:
  config:
    activate:
      on-profile: dev
  datasource:
    name: Docker_PostgreSQL
    url: jdbc:postgresql://localhost:5432/keygo
    username: postgres
    password: "admin"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: DEBUG
    xyz.lukix.keygo: DEBUG

# Remember-Me 签名密钥：dev 使用 SecurityConfig 中的默认值即可；
# 生产环境通过环境变量 KEYGO_SECURITY_REMEMBER_ME_KEY 覆盖（见 application-prod.yaml）
keygo:
  security:
    # remember-me-key: your-random-key
