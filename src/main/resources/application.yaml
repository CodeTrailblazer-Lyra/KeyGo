spring:
  application:
    name: KeyGo
  thymeleaf:
    cache: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: prod
server:
  port: 18080
  servlet:
    session:
      cookie:
        same-site: lax