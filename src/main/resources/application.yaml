# =============================================================================
# KeyGo 公共配置（所有 profile 共享）
# =============================================================================

spring:
  profiles:
    active: dev

  # ---------------------------------------------------------------------------
  # 数据源初始化：启动时自动执行幂等建表脚本
  # 全部 IF NOT EXISTS，可重复执行；新库补齐缺失表，老库跳过已存在表
  # ---------------------------------------------------------------------------
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:sql/sys_user.sql
        - classpath:sql/activation_code.sql
        - classpath:sql/activation_log.sql
        - classpath:sql/operation_log.sql
        - classpath:sql/announcement.sql
        - classpath:sql/unit.sql
        - classpath:sql/persistent_logins.sql

  # ---------------------------------------------------------------------------
  # JPA / Hibernate 公共配置
  # ---------------------------------------------------------------------------
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # JDBC 批量写入：Excel 批量导入时合并 INSERT，减少数据库往返
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        query:
          # 查询计划缓存上限（默认 2000，本项目语句数远小于此，调小回收常驻堆）
          plan_cache_max_size: 256
          plan_parameter_metadata_max_size: 32

# ---------------------------------------------------------------------------
# 服务器
# ---------------------------------------------------------------------------
server:
  port: 18080
  servlet:
    multipart:
      max-file-size: 10MB       # 单个上传文件体积上限（Excel 导入）
      max-request-size: 12MB    # 单次请求总体积上限

# ---------------------------------------------------------------------------
# 业务自定义配置（各 profile 可按需覆盖）
# ---------------------------------------------------------------------------
keygo:
  cache:
    enabled: true                            # Redis 缓存总开关（测试环境可关闭）

  # ---------------------------------------------------------------------------
  # 官方激活码联网验证（统信 UOS licensequery）
  # ---------------------------------------------------------------------------
  license:
    enabled: false                                                        # 启动时自动验证开关（false=启动不验证，但手动接口仍可用）
    url: https://license.chinauos.com/v1/openapi/legalquery              # 官方授权查询接口
    interval-ms: 300                                                     # 相邻两码请求间隔，防被官方限流
    timeout-seconds: 10                                                  # 单次请求连接/读取超时
