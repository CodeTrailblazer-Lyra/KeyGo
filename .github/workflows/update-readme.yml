name: Update README on Push

on:
  push:

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update README timestamp
        run: |
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          if [ ! -f README.md ]; then
            cat <<'EOF' > README.md
          # KeyGo

          KeyGo 是一个激活码分发平台。

          > 最后自动更新：初始化
          EOF
          fi

          if grep -q '^> 最后自动更新：' README.md; then
            sed -i "s/^> 最后自动更新：.*/> 最后自动更新：${timestamp}/" README.md
          else
            printf "\n> 最后自动更新：%s\n" "$timestamp" >> README.md
          fi

      - name: Commit and push changes
        run: |
          if git diff --quiet README.md; then
            echo "README has no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: auto update README on push [skip ci]"
          git push
